# Codex settings (sample)
model = "example-model"
approval_policy = "on-request"

[mcp_servers.node_repl]
command = "node"   # inline comment stays
args = ["repl.js", "--port", "0"]

[mcp_servers.node_repl.env]
NODE_ENV = "development"

# profile for experiments
[profiles.x]
model = "other-model"

[mcp_servers.notes]
command = "/opt/maple/bin/maple"
args = ["run", "notes"]
